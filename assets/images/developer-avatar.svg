<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f1026" />
      <stop offset="100%" stop-color="#070814" />
    </radialGradient>
    
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba86b" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGlow)" />

  <!-- Ambient Coding Screen Glow Arc -->
  <ellipse cx="200" cy="330" rx="140" ry="40" fill="#38bdf8" opacity="0.25" filter="url(#neonBlur)" />

  <!-- Body / Blue Crewneck Shirt -->
  <path d="M120 400 C120 310, 150 280, 200 280 C250 280, 280 310, 280 400 Z" fill="url(#shirtGrad)" />
  <!-- Shirt Collar -->
  <path d="M175 282 C185 295, 215 295, 225 282 C215 305, 185 305, 175 282 Z" fill="#1e40af" />

  <!-- Neck -->
  <rect x="184" y="240" width="32" height="48" rx="8" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="205" rx="42" ry="50" fill="url(#skinGrad)" />

  <!-- Ears -->
  <ellipse cx="156" cy="205" rx="8" ry="12" fill="#fba86b" />
  <ellipse cx="244" cy="205" rx="8" ry="12" fill="#fba86b" />

  <!-- Beard & Mustache -->
  <path d="M165 200 C162 245, 175 260, 200 260 C225 260, 238 245, 235 200 C225 220, 215 225, 200 225 C185 225, 175 220, 165 200 Z" fill="url(#hairGrad)" />
  <!-- Mustache -->
  <path d="M185 224 C192 220, 208 220, 215 224 C208 230, 192 230, 185 224 Z" fill="url(#hairGrad)" />

  <!-- Smile inside beard -->
  <path d="M192 234 Q200 240 208 234" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M198 195 L196 210 L204 210" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Eyes & Eyebrows -->
  <path d="M172 180 Q182 176 190 180" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M210 180 Q218 176 228 180" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none" />
  <ellipse cx="182" cy="192" rx="3.5" ry="4.5" fill="#1f2937" />
  <ellipse cx="218" cy="192" rx="3.5" ry="4.5" fill="#1f2937" />

  <!-- Modern Black-Frame Glasses -->
  <rect x="170" y="184" width="24" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#0f172a" stroke-width="3.5" />
  <rect x="206" y="184" width="24" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#0f172a" stroke-width="3.5" />
  <!-- Bridge of glasses -->
  <line x1="194" y1="192" x2="206" y2="192" stroke="#0f172a" stroke-width="3.5" />
  <!-- Temple arms -->
  <line x1="156" y1="190" x2="170" y2="190" stroke="#0f172a" stroke-width="3" />
  <line x1="230" y1="190" x2="244" y2="190" stroke="#0f172a" stroke-width="3" />

  <!-- Modern Hair with Pompadour Fade -->
  <path d="M158 190 C154 150, 168 135, 200 135 C232 135, 246 150, 242 190 C238 165, 225 155, 200 155 C175 155, 162 165, 158 190 Z" fill="url(#hairGrad)" />
  <path d="M168 152 C178 130, 222 130, 232 152 C220 145, 180 145, 168 152 Z" fill="#374151" />

  <!-- Desk & Laptop -->
  <!-- Laptop Screen Lid (Back View towards audience) -->
  <polygon points="145,340 255,340 248,275 152,275" fill="url(#laptopGrad)" stroke="#475569" stroke-width="1.5" />
  <!-- Screen Glow Accent Edge -->
  <line x1="152" y1="275" x2="248" y2="275" stroke="#38bdf8" stroke-width="2" />
  <!-- Glowing Tech Logo on Laptop Lid -->
  <circle cx="200" cy="308" r="9" fill="#f8fafc" opacity="0.9" filter="url(#neonBlur)" />
  <circle cx="200" cy="308" r="7" fill="#ffffff" />
  
  <!-- Laptop Base/Keyboard Deck -->
  <polygon points="120,380 280,380 255,340 145,340" fill="#64748b" />
  <!-- Hands on Keyboard -->
  <ellipse cx="148" cy="355" rx="14" ry="9" fill="url(#skinGrad)" />
  <ellipse cx="252" cy="355" rx="14" ry="9" fill="url(#skinGrad)" />

  <!-- Floating Sparkles / Cyber Nodes -->
  <circle cx="95" cy="130" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="310" cy="145" r="3.5" fill="#a855f7" opacity="0.8" />
  <circle cx="80" cy="260" r="2.5" fill="#ec4899" opacity="0.6" />
  <circle cx="320" cy="280" r="3" fill="#00f2fe" opacity="0.7" />
</svg>
